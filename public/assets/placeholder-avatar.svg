<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5" />
      <stop offset="100%" stop-color="#e2ab88" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Background -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)" />

  <!-- Circuit traces background -->
  <g stroke="url(#circuitGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <path d="M 50 180 H 110 L 130 150 H 180" />
    <circle cx="50" cy="180" r="4" fill="#38bdf8" />
    <circle cx="180" cy="150" r="3" fill="#38bdf8" />

    <path d="M 350 200 H 290 L 270 230 H 230" />
    <circle cx="350" cy="200" r="4" fill="#38bdf8" />
    <circle cx="230" cy="230" r="3" fill="#38bdf8" />

    <path d="M 120 70 V 110 L 140 130" />
    <circle cx="120" cy="70" r="4" fill="#38bdf8" />

    <path d="M 280 70 V 100 L 260 120" />
    <circle cx="280" cy="70" r="4" fill="#38bdf8" />
    
    <!-- Electrical sine wave motif -->
    <path d="M 60 300 Q 80 270 100 300 T 140 300" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4" />
    <path d="M 260 300 Q 280 270 300 300 T 340 300" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4" />
  </g>

  <!-- Glowing outer ring -->
  <circle cx="200" cy="200" r="190" stroke="#38bdf8" stroke-width="3" stroke-dasharray="12 12" opacity="0.4" />
  <circle cx="200" cy="200" r="180" stroke="#0ea5e9" stroke-width="1.5" opacity="0.3" />

  <!-- Silhouette / Professional Avatar -->
  <!-- Shoulders & Suit -->
  <path d="M 80 395 C 90 320 130 280 200 280 C 270 280 310 320 320 395 Z" fill="url(#suitGrad)" />
  <!-- Shirt collar -->
  <polygon points="180,280 200,340 220,280" fill="#f8fafc" />
  <!-- Blue Tie -->
  <polygon points="195,300 205,300 210,360 200,375 190,360" fill="url(#tieGrad)" />
  <polygon points="193,295 207,295 203,308 197,308" fill="#0369a1" />

  <!-- Neck -->
  <path d="M 182 230 H 218 V 290 H 182 Z" fill="#e2ab88" />
  <!-- Neck shadow -->
  <path d="M 182 230 H 218 V 255 C 218 265 182 265 182 255 Z" fill="#cf9775" opacity="0.5" />

  <!-- Head / Face -->
  <ellipse cx="200" cy="195" rx="55" ry="68" fill="url(#skinGrad)" />

  <!-- Professional Hair Style -->
  <path d="M 142 185 C 138 135 160 115 200 115 C 245 115 262 135 258 185 C 255 170 248 130 200 130 C 152 130 145 170 142 185 Z" fill="#1e293b" />
  <path d="M 142 170 C 145 140 170 120 200 120 C 235 120 255 135 258 165 C 250 145 230 132 200 132 C 168 132 148 148 142 170 Z" fill="#0f172a" />

  <!-- Ears -->
  <ellipse cx="144" cy="195" rx="7" ry="14" fill="#e2ab88" />
  <ellipse cx="256" cy="195" rx="7" ry="14" fill="#e2ab88" />

  <!-- Smart glasses/spectacles -->
  <rect x="160" y="180" width="32" height="24" rx="6" fill="none" stroke="#0f172a" stroke-width="2.5" />
  <rect x="208" y="180" width="32" height="24" rx="6" fill="none" stroke="#0f172a" stroke-width="2.5" />
  <line x1="192" y1="190" x2="208" y2="190" stroke="#0f172a" stroke-width="2.5" />
  <line x1="148" y1="187" x2="160" y2="187" stroke="#0f172a" stroke-width="2" />
  <line x1="240" y1="187" x2="252" y2="187" stroke="#0f172a" stroke-width="2" />

  <!-- Eyes behind glasses -->
  <ellipse cx="176" cy="192" rx="4" ry="4" fill="#1e293b" />
  <ellipse cx="224" cy="192" rx="4" ry="4" fill="#1e293b" />
  <circle cx="178" cy="190" r="1.5" fill="#ffffff" />
  <circle cx="226" cy="190" r="1.5" fill="#ffffff" />

  <!-- Eyebrows -->
  <path d="M 160 173 Q 175 168 190 174" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 210 174 Q 225 168 240 173" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Nose -->
  <path d="M 200 193 V 212 H 206" stroke="#c58e6e" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Confident Smile -->
  <path d="M 185 230 Q 200 242 215 230" stroke="#b45a43" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Lightning Bolt Badge Overlay (Bottom Right) -->
  <g transform="translate(290, 290)">
    <circle cx="40" cy="40" r="38" fill="#0f172a" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
    <!-- Flash bolt -->
    <path d="M 42 16 L 24 42 H 38 L 34 64 L 56 36 H 42 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1" />
  </g>
</svg>
